<style>
:root{
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --ground:#e8eef0; --stars:none;
  --panel:#fbfcfc; --panel2:#eef3f5;
  --ink:#0f2233; --muted:#5d7080;
  --line:#cfd9de; --line2:transparent;
  --accent:#f2b705; --on-accent:#1a1400;
  --track:#dde6ea;
  --c-know:#2f6fdb; --c-body:#e2574c; --c-skill:#23976a; --c-bond:#7b5bd6;
  --r:18px; --rs:999px; --bw:1px;
  --shadow:0 1px 2px rgba(15,34,51,.06),0 10px 26px -14px rgba(15,34,51,.28);
  --btn-shadow:0 6px 14px -6px rgba(180,130,0,.6);
  --seg:none; --ls:0;
  --tabbg:rgba(251,252,252,.94);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
button,a,[data-act]{touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:var(--ground);background-image:var(--stars);background-size:150px 130px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;letter-spacing:var(--ls);-webkit-tap-highlight-color:transparent}
body{padding-inline:16px;overflow-y:auto}
#app{max-width:480px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.lbl{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ttl{font-family:var(--f-disp);font-weight:900;font-size:19px;line-height:1.35;text-wrap:balance}
.muted{color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--f-disp);font-weight:900;font-size:17px}
.brand small{font-family:var(--f-num);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-left:8px;font-weight:500}
.ex{background:var(--accent);color:var(--on-accent);padding:6px 12px;font-size:12px;border-radius:var(--rs);display:flex;justify-content:space-between;gap:10px;align-items:center}
.ex button{background:none;border:0;text-decoration:underline;color:inherit;padding:0;font-size:12px}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ava{width:96px;height:96px;background:var(--panel2);border:var(--bw) solid var(--line);border-radius:var(--r);display:grid;place-items:center}
:root:not([data-skin="pixel"]) .ava{border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,var(--panel2))}
.ava canvas{width:80px;height:80px;image-rendering:pixelated}
.rank{font-size:12px;color:var(--muted);letter-spacing:.14em}
.hname{font-family:var(--f-disp);font-weight:900;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.lvrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.lv{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.lv b{font-size:26px;color:var(--ink);margin-left:2px}
.lvrow .bar{flex:1}
.bar{height:14px;background:var(--track);border:var(--bw) solid var(--line);border-radius:var(--rs);overflow:hidden}
:root:not([data-skin="pixel"]) .bar{border-color:transparent;height:10px}
.bar i{display:block;height:100%;width:0;background-color:var(--c,var(--accent));background-image:var(--seg);transition:width .5s}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border:var(--bw) solid var(--line);border-radius:var(--rs);background:var(--panel2);font-size:13px;display:flex;gap:6px;align-items:baseline}
.chip b{font-family:var(--f-num);font-size:16px}
.btn{display:block;width:100%;padding:14px 16px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--panel);font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:var(--btn-shadow)}
.btn.pri:active{transform:translateY(3px);box-shadow:none}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:13px;min-height:44px}
.btn.dng{border-color:#e2574c;color:#e2574c}
/* goal */
.goal{display:flex;flex-direction:column;gap:12px}
.goalhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cond{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:var(--bw) solid transparent;border-radius:var(--r);padding:10px 12px;min-height:44px}
.cond .bx{flex:none;width:22px;height:22px;border:var(--bw) solid var(--line);border-radius:var(--rs);display:grid;place-items:center;background:var(--track)}
:root:not([data-skin="pixel"]) .cond .bx{border-radius:7px}
.cond.done .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cond.done .t{color:var(--muted);text-decoration:line-through}
.cond .tx{display:flex;flex-direction:column;gap:2px}
.cond .tx small{font-size:12px;color:var(--muted);letter-spacing:0}
/* stats */
.stat{display:grid;grid-template-columns:4.6em 1fr auto;gap:4px 12px;align-items:center;padding-block:8px}
.stat+.stat{border-top:var(--bw) dashed var(--line2,var(--line))}
:root:not([data-skin="pixel"]) .stat+.stat{border-top:1px solid var(--line)}
.stat .n{font-weight:900;color:var(--c)}
.stat .n small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.stat .l{font-family:var(--f-num);font-size:13px;text-align:right}
.stat .bar i{background-color:var(--c)}
.stat .m{grid-column:2/4;font-size:12px;color:var(--muted)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;margin-top:10px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.col .v{font-size:11px;color:var(--muted);font-family:var(--f-num);min-height:14px}
.stk{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;background:var(--track);border-radius:var(--rs);overflow:hidden;flex:1;justify-content:flex-start;border:var(--bw) solid var(--line)}
:root:not([data-skin="pixel"]) .stk{border-color:transparent;border-radius:8px}
.stk i{display:block;width:100%}
.dl{font-size:12px;color:var(--muted)}
.col.today .dl{color:var(--ink);font-weight:900}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;background:var(--c);margin-right:6px;border-radius:var(--rs)}
.day{display:flex;flex-direction:column;gap:6px}
.day h3{font-size:12px;color:var(--muted);letter-spacing:.12em;font-weight:500;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px 12px}
.tag{font-size:12px;font-weight:900;color:#fff;background:var(--c);padding:2px 8px;border-radius:var(--rs)}
.row .t{overflow-wrap:anywhere;font-size:14px}
.row .x{background:none;border:0;color:var(--muted);font-size:12px;padding:8px;min-height:44px}
.row .x.arm{color:#e2574c;font-weight:900}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=time],textarea{width:100%;padding:12px;background:var(--panel2);border:var(--bw) solid var(--line);border-radius:var(--r);color:var(--ink);font-size:16px}
:root:not([data-skin="pixel"]) input,:root:not([data-skin="pixel"]) textarea{border-radius:12px}
textarea{resize:vertical;min-height:70px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skinpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{padding:14px 10px;text-align:center;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--panel2);font-weight:700}
.sk small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.sk[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px}
.cc{display:flex;flex-wrap:wrap;gap:8px}
.cc button{padding:10px 14px;border:var(--bw) solid var(--line);border-radius:var(--rs);background:var(--panel2);font-weight:700;min-height:44px}
:root:not([data-skin="pixel"]) .cc button{border-radius:12px}
.cc button[aria-pressed=true]{background:var(--c,var(--accent));color:#fff;border-color:var(--c,var(--accent))}
.cc.mins button[aria-pressed=true]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.addrow{display:flex;gap:8px}
.ce{display:flex;gap:8px;flex-wrap:wrap}
.ce input{flex:1 1 100%}
.ce select{flex:1;min-width:0;padding:10px;background:var(--panel2);border:var(--bw) solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;font-size:14px}
.next .ttl{font-size:21px}
.say{font-size:13px;line-height:1.6;padding:8px 12px;background:var(--panel2);border-left:var(--bw) solid var(--accent);margin:0}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:8px;background:var(--track);border:1px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dno{font-family:var(--f-num);color:var(--accent);margin-right:6px}
.steps{flex:1 1 100%;background:var(--panel2);padding:10px 12px;border-radius:var(--r);display:flex;flex-direction:column;gap:8px}
.steps ol{margin:0;padding-left:1.6em;font-size:13px;display:flex;flex-direction:column;gap:6px}
.steps li.d{color:var(--muted);text-decoration:line-through}
.steps li span.m{font-family:var(--f-num);color:var(--muted);font-size:12px;margin-left:6px;text-decoration:none;display:inline-block}
.steps .x{background:none;border:0;color:var(--muted);padding:4px 8px;font-size:12px;min-height:40px;min-width:40px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn:disabled{opacity:.6}
.next{display:flex;flex-direction:column;gap:10px;border-color:var(--accent)}
.alt{display:flex;gap:10px;align-items:center;background:var(--panel2);padding:10px 12px;border-radius:var(--r)}
.addrow input{flex:1}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--tabbg);border-top:var(--bw) solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;max-width:480px}
nav button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-height:56px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
nav button[aria-current=page]{color:var(--accent)}
:root:not([data-skin="pixel"]) nav button[aria-current=page]{color:var(--ink);font-weight:900}
:root:not([data-skin="pixel"]) nav button[aria-current=page] svg{stroke:var(--accent);fill:var(--accent);fill-opacity:.25}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,8,20,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-inline:16px}
.ov.mid{align-items:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow-y:auto;margin-bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ov:not(.mid) .sheet{border-bottom-left-radius:0;border-bottom-right-radius:0}
.clear{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.clear .big{font-family:var(--f-disp);font-weight:900;font-size:34px;letter-spacing:.06em;color:var(--accent);line-height:1.1}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;z-index:30;background:var(--accent);color:var(--on-accent);padding:12px 16px;font-weight:900;text-align:center;border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:opacity .25s,transform .25s;pointer-events:none}
#toast[hidden]{display:block!important;opacity:0;transform:translateY(12px)}
.lvup{animation:pop .5s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
textarea.io{font-family:var(--f-num);font-size:12px;min-height:90px}
:root{--ok:#23976a;--warn:#c77700;--info:#2f6fdb}
.ideal,.navi{display:flex;flex-direction:column;gap:10px}
.pctrow{display:flex;align-items:center;gap:12px}
.pct{font-size:14px;color:var(--muted);white-space:nowrap}
.pct b{font-size:34px;color:var(--ink);line-height:1}
.pctrow .bar{flex:1;height:16px}
.stepper{list-style:none;display:flex;gap:6px;margin:0;padding:0}
.stepper li{flex:1;text-align:center;font-size:12px;padding:6px 4px;border:var(--bw) solid var(--line);background:var(--panel2);color:var(--muted);border-radius:var(--r)}
.stepper li.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:900}
.gapi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.gapi:first-of-type{border-top:0}
.gapi b{font-weight:900}
.gapi .d{grid-column:1/-1;font-size:12px;color:var(--muted)}
.chaps{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.chap{padding:12px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.chap.now{border-color:var(--accent)}
.chap.done{opacity:.7}
.chap h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chap p{font-size:12px;color:var(--muted);margin:0}
em.rs{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
ul.pl{margin:6px 0 0;padding-left:1.2em;font-size:13px;display:flex;flex-direction:column;gap:4px}
/* ---- ジブンクエストらしさ: 英字ラベル・攻略マップ・演出 ---- */
:root{--halo:rgba(242,183,5,.28)}
.en{font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:inline-flex;align-items:center}
.en::before{content:"";width:8px;height:8px;background:var(--accent);margin-right:8px;flex:none}
:root:not([data-skin="pixel"]) .en::before{border-radius:2px}
.next{border-top:4px solid var(--accent)}
.rise{animation:rise .4s both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fxin{from{opacity:0}to{opacity:1}}
.fx{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,14,30,.45);padding:16px;animation:fxin .2s both}
.fx[hidden]{display:none!important}
.fxc{background:var(--panel);border:var(--bw) solid var(--accent);border-radius:var(--r);padding:22px 20px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:var(--shadow);animation:pop .35s both}
.xp{font-family:var(--f-num);font-size:48px;font-weight:700;line-height:1;color:var(--ink)}
.xp small{font-size:16px;color:var(--muted);margin-left:6px}
.sheet.clear .say{text-align:left;width:100%}
/* map */
.map{display:flex;flex-direction:column;margin-top:8px}
.node{display:grid;grid-template-columns:40px 1fr;gap:14px;position:relative;padding-bottom:18px}
.node::before{content:"";position:absolute;left:19px;top:40px;bottom:-2px;width:2px;background:var(--line)}
.node.done::before{background:var(--accent)}
.node.final::before{display:none}
.node.final{padding-bottom:0}
.pin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);color:var(--muted);z-index:1;flex:none}
.pin svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.node.done .pin{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.node.now .pin{background:var(--panel);border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 5px var(--halo)}
.node.final .pin{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.node .body{display:flex;flex-direction:column;gap:4px;min-width:0;padding-top:2px}
.node .body h3{font-size:17px;font-weight:900;margin:0;line-height:1.35}
.node .body p{margin:0;font-size:13px;color:var(--muted)}
.node.lock .body{opacity:.62}
.you{font-style:normal;background:var(--accent);color:var(--on-accent);padding:1px 8px;margin-left:8px;font-size:11px;letter-spacing:.06em}
:root:not([data-skin="pixel"]) .you{border-radius:999px}
.mini{display:flex;align-items:center;margin-top:4px}
.mini i{width:16px;height:16px;border-radius:50%;background:var(--track);border:2px solid var(--line);flex:none}
.mini i.done{background:var(--accent);border-color:var(--accent)}
.mini i.now{background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 4px var(--halo)}
.mini i.fin{background:var(--ink);border-color:var(--ink)}
.mini u{flex:1;height:2px;background:var(--line);text-decoration:none;min-width:6px}
.mini u.done{background:var(--accent)}
.fut{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin-top:6px}
.fut>div{background:var(--panel2);padding:8px 10px;border-radius:var(--r);min-width:0;display:flex;flex-direction:column;gap:2px}
.fut b{font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.fut span.k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.fut i{align-self:center;color:var(--muted);font-style:normal}
.delta{display:flex;flex-direction:column;gap:8px}
.dcells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---- AI生成の利用回数の制限(通算50回)。localStorage に、使った回数だけを持つ ----
   ・キー: jibun_quest_ai_usage_count(アプリのデータ・バックアップ・「最初からやり直す」とは別。消えない)
   ・AIの呼び出しが成功したときだけ +1(エラー時は消費しない)。残りが0なら、AIを呼ばずに止めて通知する
   ・対象外: 自分のAPIキーを登録している場合(費用は本人の負担)/ プレミアム状態
   ※localStorage の値は、利用者が書き換えられる。これは「使いすぎの目安」で、厳密な制限や不正防止ではない */
const MAX_AI_USAGE=50, AI_USAGE_KEY="jibun_quest_ai_usage_count";
const AI_LIMIT_MSG=`AI利用上限（${MAX_AI_USAGE}回）に達しました。今後は手動でタスクを編集するか、設定画面からAPIキーをご登録ください。`;
let aiUsageMem=0, aiManualT=0;
function aiUsageGet(){
  try{const v=parseInt(localStorage.getItem(AI_USAGE_KEY),10);return Math.min(Math.max(Number.isFinite(v)&&v>0?v:0,aiUsageMem),MAX_AI_USAGE)}   // 保存できない環境では、このセッションのメモリ上の回数も使う
  catch(_){return Math.min(aiUsageMem,MAX_AI_USAGE)}
}
function aiUsageSet(n){aiUsageMem=n;try{localStorage.setItem(AI_USAGE_KEY,String(n))}catch(_){}}
const aiUsageLeft=()=>Math.max(0,MAX_AI_USAGE-aiUsageGet());
const aiExempt=()=>usingProxy()||AIQ.premium()||!!(featOn("byok")&&byokKey()&&!window.claude);   // サーバー経由のときは、無料枠・購入分ともに、サーバーが管理する
const aiLimitBlocked=()=>!aiExempt()&&aiUsageLeft()<=0;
function aiLeftText(){
  if(AIQ.premium()||(featOn("byok")&&byokKey()&&!window.claude))return "（回数制限なし）";
  if(usingProxy()){   // 運営者のAI: サーバーが数える無料枠と、購入した回数
    const q=S.quota;if(!q)return "";
    if(q.plan==="paid")return q.limit?`（今月の残り ${q.remaining}/${q.limit} 回）`:"（回数制限なし）";
    const c=+q.credits||0;
    if(q.plan==="credits")return `（購入分 残り ${c} 回）`;
    if(q.remaining>0)return `（残り ${q.remaining}/${q.limit||MAX_AI_USAGE} 回${c>0?` ＋購入分 ${c} 回`:""}）`;
    return c>0?`（購入分 残り ${c} 回）`:`（残り 0/${q.limit||MAX_AI_USAGE} 回）`;
  }
  return `（残り ${aiUsageLeft()}/${MAX_AI_USAGE} 回）`;
}

/* AIの利用回数: 今月の利用・上限・残りを持つ。上限は window.JQ.aiMonthlyLimit(未設定=上限なし)。

const AIQ={

  limit(){const v=window.JQ&&window.JQ.aiMonthlyLimit;return Number.isFinite(+v)&&+v>0?Math.round(+v):null},
  info(){const u=AIQ.used(),p=AIQ.premium(),l=p?null:AIQ.limit();return{used:u,limit:l,remaining:l==null?null:Math.max(0,l-u),premium:p}},
  blocked(){const i=AIQ.info();return i.limit!=null&&i.remaining<=0},

};

const DAY=864e5, mid=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const r5=n=>Math.max(5,Math.round(n/5)*5);
function plan(cat,cap){
  const now=Date.now(),tk=dkey(now);
  const mine=S.logs.filter(l=>l.cat===cat.id);
  const rec=mine.filter(l=>now-l.t<14*DAY);
  const doneToday=mine.some(l=>dkey(l.t)===tk);
  const last=S.logs.length?Math.max(...S.logs.map(l=>l.t)):0;
  const gap=last?Math.round((mid(now)-mid(last))/DAY):99;
  const st=streak();
  const withNote=[...mine].sort((a,b)=>b.t-a.t).find(l=>l.note);
  let min,reason;
  if(!rec.length){min=15;reason="この分野はまだ記録がありません。まず15分だけ、始めることが目標です。"}
  else{
    const days=new Set(rec.map(l=>dkey(l.t))).size, avg=rec.reduce((a,l)=>a+l.min,0)/days;
    if(gap>=3){min=Math.max(10,r5(avg/2));reason=`${gap}日空いているので、いつもの半分から再開します。`}
    else if(st>=3){min=Math.min(60,r5(avg)+5);reason=`${st}日連続中。平均${Math.round(avg)}分より、ほんの少しだけ上げます。`}
    else{min=Math.min(60,Math.max(10,r5(avg)));reason=`直近の平均${Math.round(avg)}分に合わせた、続けられる量です。`}
  }
  if(cap)min=Math.min(min,cap);
  const note=withNote?withNote.note:cat.notes[Math.floor(now/DAY)%cat.notes.length];
  return{cat,min,note,reason,doneToday,cont:!!withNote,gap,st};
}

  if(goalReached())return null;
  const now=Date.now(),wk=id=>S.logs.filter(l=>l.cat===id&&now-l.t<7*DAY).reduce((a,l)=>a+l.min,0);
  const cc=curChapter(),open=(S.ideal.milestones||[]).filter(m=>!m.done),ms=open.find(m=>cc&&m.chapterId===cc.id)||open[0]||null;
  const cat=ms?(CATS.find(x=>x.id===ms.cat)||CATS[0]):[...CATS].sort((a,b)=>wk(a.id)-wk(b.id))[0];

  ".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khsssssshk...","...khsksskshk...",
  "....ksssssssk...",".....kssssk.....","....kbbbbbbk....","...kbbbbbbbbk...","...ksbbggbbsk...",
  "...ksbbbbbbsk...","....kbbbbbbk....","....kllkkllk....","....kllk.kllk...","...kkkk...kkkk.."," ................"
  ].map(r=>r.padEnd(16,".").replace(/ /g,".").slice(0,16).split(""));
  while(rows.length<16)rows.push(Array(16).fill("."));

function rangeBuckets(R){
  const B=[],todayK=dkey(Date.now()),mk=(s0,e0,label)=>B.push({s:s0,e:e0,label,by:{},tot:0,today:todayK>=dkey(s0)&&todayK<dkey(e0)});

      mk(a.getTime(),b.getTime(),logR.r==="week"?"日月火水木金土"[a.getDay()]:(i%5===0||i===R.len-1?String(a.getDate()):""));
    }

    const tmp=[];
    for(let e=R.end;e>R.start;){const de=new Date(e),st=Math.max(R.start,new Date(de.getFullYear(),de.getMonth(),de.getDate()-7).getTime());tmp.unshift([st,e]);e=st}
    tmp.forEach(([st,e])=>mk(st,e,`${new Date(st).getMonth()+1}/${new Date(st).getDate()}`));
  }else{
    const f=new Date(R.start),now=new Date(),list=[];let y=f.getFullYear(),m=f.getMonth();

}

let payBusy=false,priceLabel="";
/* 残り回数の確認(サーバーの /quota。回数は消費しない) */
async function refreshQuota(){
  if(!usingProxy())return false;
  try{
    const r=await fetch(String(window.JQ.aiEndpoint).replace(/\/ai\/?$/,"/quota"),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({device:deviceId()})});
    if(!r.ok)return false;
    const q=(await r.json()||{}).quota;if(!q)return false;
    const c=Math.max(0,Math.round(+q.credits)||0);
    if(S.quota&&S.quota.plan==="paid")S.quota={...S.quota,credits:c};
    else S.quota=q.remaining>0?{plan:"trial",remaining:q.remaining,limit:q.limit,credits:c}:c>0?{plan:"credits",remaining:c,limit:null,credits:c}:{plan:"trial",remaining:0,limit:q.limit,credits:0};
    save();updateAiLeft();return true;
  }catch(_){return false}
}
async function loadPackPrices(){
  const B=window.JQ_BILLING;if(!B||!B.packs)return false;
  try{const l=await B.packs(),n={};(l||[]).forEach(x=>{if(x&&x.id)n[x.id]=x.price||""});const ch=JSON.stringify(n)!==JSON.stringify(packPrices);packPrices=n;return ch}catch(_){return false}
}
// 購入の通知(webhook)は、少し遅れて届く。購入分が増えるまで、数回、確認する
async function pollCredits(before){
  const ms=(window.JQ&&window.JQ.pollMs)||2000;
  for(let i=0;i<10;i++){
    await new Promise(r=>setTimeout(r,i?ms:0));
    await refreshQuota();
    if(((S.quota&&+S.quota.credits)||0)>before)return true;
  }
  return false;
}
async function buyPack(id){
  const B=window.JQ_BILLING,pk=packList().find(p=>p.id===id);
  if(!B||!B.buyPack||!pk||payBusy)return;
  payBusy=true;render();
  const before=(S.quota&&+S.quota.credits)||0;
  try{
    const ok=await B.buyPack(id);
    if(!ok)toast("購入は完了しませんでした");
    else{
      toast("ご購入ありがとうございます。回数の反映を確認しています…");
      const up=await pollCredits(before);
      toast(up?`AIの回数を${pk.credits}回追加しました`:"購入は完了しています。回数の反映に、少し時間がかかっています。しばらくしてから、設定の「購入の反映を確認」を押してください");
      aiFail=null;
    }
  }catch(e){toast("処理を完了できませんでした。しばらくしてから、もう一度お試しください")}
  payBusy=false;ovClose();render();updateAiLeft();
}
async function checkCredits(){const ok=await refreshQuota();toast(ok?"最新の残り回数を確認しました":"確認できませんでした。通信の状態を確認してください");render()}
async function loadPrice(){const B=window.JQ_BILLING;if(!B||!B.price||priceLabel)return;try{priceLabel=(await B.price())||"";render()}catch(_){}}
async function payAction(kind){
  const B=window.JQ_BILLING;if(!B||payBusy)return;
  payBusy=true;render();
  try{
    const ok=kind==="buy"?await B.purchase():await B.restore();
    if(ok){S.quota={plan:"paid",remaining:null,limit:(S.quota&&S.quota.limit)||null};save();aiFail=null;toast(kind==="buy"?"ご購入ありがとうございます":"購入を復元しました")}

  }catch(e){toast("処理を完了できませんでした。しばらくしてから、もう一度お試しください")}
  payBusy=false;render();
}

function addLog(){
  syncSheet();
  const q=!!sh.quest,r=q?(sh.result||"done"):"done";
  let m=r==="skipped"?0:Math.round(+sh.min||0);
  if((r==="done"||r==="partial")&&!(m>=1&&m<=720)){toast("1〜720分の範囲で入力してください");return}
  if(m<0||m>720){toast("0〜720分の範囲で入力してください");return}
  const pre={lv:snap().tot,ti:titlesNow()};
  const ms=q&&S.ai&&S.ai.msId?(S.ideal.milestones||[]).find(x=>x.id===S.ai.msId):null;
  const cat=sh.cat,note=(sh.note||"").trim();
  const lgId=uid();
  S.logs.push({id:lgId,t:Date.now(),cat,min:m,note,result:r,feel:sh.feel||null,cause:sh.cause||null,quest:q});
  if(q&&S.ai)S.ai.log={result:r,min:m,t:Date.now()};
  sh={cat:"know",min:30};
  const nb=evalBadges();
  save();ovClose();render();
  if(m>0&&(r==="done"||r==="partial"))showComplete(pre,{r,min:m,cat,ms,badges:nb,logId:lgId});
  else if(q)showPaused();

  if(q)reflect();
}

function evalBadges(){
  if(!S.ideal)return [];
  const got=[];if(!S.badges||typeof S.badges!=="object")S.badges={};
  BADGES.forEach(b=>{if(!S.badges[b[0]]){let ok=false;try{ok=!!b[3]()}catch(e){}if(ok){S.badges[b[0]]=Date.now();got.push(b)}}});
  return got;
}
const latestBadge=()=>{const e=Object.entries(S.badges||{}).filter(([k])=>BADGES.some(b=>b[0]===k)).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:""};
function badgeCard(){
  const list=BADGES.filter(b=>b[4]!=="広場"||featOn("community")),got=b=>S.badges&&S.badges[b[0]];
  const on=list.filter(got).length,groups=[...new Set(list.map(b=>b[4]))];

    ${groups.map(g=>{const L=list.filter(b=>b[4]===g),n=L.filter(got).length,gid="badges-"+g;
      return `<details class="bdg-grp" data-det="${gid}" ${openSteps.has(gid)?"open":""}><summary class="bdg-h"><span>${esc(g)}</span><small class="num">${n}/${L.length}</small></summary><div class="bdg-g">${L.map(cell).join("")}</div></details>`}).join("")}</details>`;

function radarCard(){
  const {by}=stats(),lvs=CATS.map(c=>lvOf(by[c.id],30)),mx=Math.max(5,...lvs)+1,cx=130,cy=104,R=66;
  const pt=(i,f)=>{const a=-Math.PI/2+i*Math.PI/2;return [cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  const s=p=>p.map(n=>n.toFixed(1)).join(",");
  const frac=(c,i)=>{const x=by[c.id],l=lvs[i],lo=need(l,30),sp=need(l+1,30)-lo;return Math.max(.04,(l-1+(x-lo)/sp)/(mx-1))};
  const poly=CATS.map((c,i)=>s(pt(i,frac(c,i)))).join(" ");
  const ring=f=>CATS.map((_,i)=>s(pt(i,f))).join(" ");
  const lab=[[cx,cy-R-14,"middle"],[cx+R+10,cy+4,"start"],[cx,cy+R+22,"middle"],[cx-R-10,cy+4,"end"]];
  return `<section class="panel radar" aria-label="ステータス"><span class="en">STATS ・ 4つの力</span>
    <svg class="rd" viewBox="0 0 260 210" role="img" aria-label="${CATS.map((c,i)=>`${c.n} Lv${lvs[i]}`).join("、")}">
      ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" class="rg"/>`).join("")}
      ${CATS.map((_,i)=>{const e=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" class="rg"/>`}).join("")}
      <polygon points="${poly}" class="rp"/>
      ${CATS.map((c,i)=>{const p=pt(i,frac(c,i));return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${c.c}"/>`}).join("")}
      ${CATS.map((c,i)=>`<text x="${lab[i][0]}" y="${lab[i][1]}" text-anchor="${lab[i][2]}" class="rl">${c.n} Lv${lvs[i]}</text>`).join("")}
    </svg>
    <div class="rd-l">${CATS.map((c,i)=>`<div style="--c:${c.c}"><span class="tag">${c.n}</span><b class="num">Lv${lvs[i]}</b><small class="num">${by[c.id]} 経験値</small></div>`).join("")}</div>
    <p class="sub">行動した時間(分)が、そのまま経験値になります。外側ほど、その力が育っています。</p></section>`;
}

async function commCall(p,body){
  const b=commBase();if(!b)return{status:0};
  try{const r=await fetch(b+"/"+p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});let j=null;try{j=await r.json()}catch(e){}return{status:r.status,json:j}}
  catch(e){return{status:0}}
}

async function commAct(a,el){
  const v=el.dataset.v,id=el.dataset.id;
  if(a==="join"){cj={nick:"",av:"a1"};joinSheet();return}
  if(a==="av"){cj.av=v;joinSheet();return}
  if(a==="go"){
    const g=$("#cm-nick");if(g)cj.nick=g.value;
    const n=nickOk(cj.nick);if(!n){toast("ニックネームは1〜12文字で、メール・URL・長い数字は使えません");return}
    S.comm={...commDef(),on:true,nick:n,av:/^a[1-8]$/.test(cj.av)?cj.av:"a1",cid:gid(),secret:gid()};
    save();ovClose();commLoad();render();toast("広場に参加しました");return}
  if(a==="ref"){commLoad();render();return}
  if(a==="rx"){
    const p=feed.posts.find(x=>x.id===id);if(!p)return;
    const dm=feed.demo,my=(dm?demoRx:S.comm.rx)[id]||"",on=my!==v;
    if(dm){const rx={like:0,tired:0,wow:0,cheer:0,...p.rx};if(my&&rx[my]>0)rx[my]--;if(on)rx[v]++;p.rx=rx;if(on)demoRx[id]=v;else delete demoRx[id];render();return}
    const r=await commCall("react",{cid:S.comm.cid,postId:id,type:v,on});
    if(r.status===200&&r.json&&r.json.rx){p.rx=r.json.rx;if(on)S.comm.rx[id]=v;else delete S.comm.rx[id];const ks=Object.keys(S.comm.rx);if(ks.length>300)ks.slice(0,ks.length-300).forEach(k=>delete S.comm.rx[k]);save();render()}
    else toast(r.status===429?"今日のリアクションの上限です":"通信できませんでした");return}
  if(a==="rep"){const r=await commCall("report",{cid:S.comm.cid,postId:id});toast(r.status===200?"報告しました。ありがとうございます":"通信できませんでした");return}
  if(a==="block"){S.comm.blocked=[...new Set([...(S.comm.blocked||[]),id])].slice(-200);save();render();toast("この人の投稿を非表示にしました");return}
  if(a==="unblock"){S.comm.blocked=[];save();render();return}
  if(a==="share"){shareSheet(id);return}
  if(a==="phr"){cs.phrase=cs.phrase===v?"":v;shareSheet(cs.id);return}
  if(a==="tog"){cs[v]=!cs[v];shareSheet(cs.id);return}
  if(a==="post"){
    const l=S.logs.find(x=>x.id===(cs&&cs.id));if(!l||cBusy)return;
    const body={cid:S.comm.cid,secret:S.comm.secret,nick:S.comm.nick,av:S.comm.av,cat:l.cat,min:Math.min(l.min,10080),kind:l.quest?"quest":"action"};
    if(cs.phrase)body.phrase=cs.phrase;if(cs.streak)body.streak=streak();if(cs.badge&&latestBadge())body.badge=latestBadge();
    cBusy=true;const r=await commCall("post",body);cBusy=false;
    if(r.status===200&&r.json&&r.json.post){S.comm.posts.push({id:r.json.post.id,logId:l.id,t:Date.now()});save();cs=null;ovClose();toast("広場に投稿しました");if(view==="com"){commLoad();render()}else render()}
    else{toast(r.status===429?"今日の投稿の上限です":r.status===400?"この内容は投稿できませんでした":"通信できませんでした。あとでもう一度お試しください");shareSheet(l.id)}
    return}
  if(a==="del"){
    if(armed!=="cd"+id){armed="cd"+id;render();return}
    armed=null;const r=await commCall("delete",{cid:S.comm.cid,secret:S.comm.secret,postId:id});
    if(r.status===200||r.status===404){S.comm.posts=S.comm.posts.filter(p=>p.id!==id);feed.posts=feed.posts.filter(p=>p.id!==id);save();render();toast("削除しました")}
    else{render();toast("削除できませんでした。通信できる状態で、もう一度お試しください")}return}
  if(a==="delall"||a==="leave"){
    const key=a==="leave"?"cleave":"cdall";
    if(armed!==key){armed=key;render();return}
    armed=null;const r=await commCall("delete",{cid:S.comm.cid,secret:S.comm.secret,all:true});
    if(r.status!==200){render();toast("削除できませんでした。通信できる状態で、もう一度お試しください");return}
    if(a==="leave")S.comm=commDef();else S.comm.posts=[];
    feed.posts=[];save();commLoad();render();toast(a==="leave"?"広場から退会しました":"共有した投稿をすべて削除しました");return}
}

async function saveBackupFile(){
  // 保存の優先順位: (1) Claudeの公開ページ: downloads(保存の確認つき) (2) 共有シート(iPhoneアプリなど) (3) 通常のダウンロード
  const name="ジブンクエスト_バックアップ_"+dkey(Date.now())+".json",data=backupJSON(),fail=()=>toast("ファイルに保存できませんでした。「コピー」をお使いください");
  let D=null;try{D=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(_){}
  if(D&&D.save){try{await D.save({filename:name,data});toast("ファイルに保存しました")}catch(e){e&&e.code==="declined"?toast("保存を取りやめました"):fail()}return}
  if(window.claude){toast("この画面では、ファイルに保存できません。「コピー」をお使いください");return}
  try{
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"ジブンクエストのバックアップ"});toast("共有しました")}catch(e){if(!(e&&e.name==="AbortError"))fail()}return}
    const u=URL.createObjectURL(file),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast("ファイルに保存しました")}
  catch(_){fail()}
}

    for(let d=13;d>=0;d--){if(d===4||d===9)continue;
      for(let j=0;j<(d%3===0?2:1);j++){const cat=CATS[(d+j*2)%4];
        S.logs.push({id:uid(),t:new Date(now.getFullYear(),now.getMonth(),now.getDate()-d,9+j*4).getTime(),cat:cat.id,min:mins[(d*3+j)%5],note:cat.notes[(d+j)%3]})}}
    S.sample=true;S.ai=null;S.box=null;
  }else{
    const title=$("#o-title").value.trim();
    if(!title){toast("なりたい自分を入力してください");$("#o-title").focus();return}
    S.name=$("#o-name").value.trim();S.aiAuto=false;   // 「AIを使わず続ける」: AIの自動提案はオフ(設定で切り替えられる)
    S.ideal={title,why:$("#o-why").value.trim(),created:Date.now()};
    S.ideal.chapters=[["現在地を知り、土台を作る","今の自分を書き出し、続けられる習慣を作る"],["小さな成果を出す","最初の小さな実績を1つ作る"],["続けて実績にする","習慣と成果を、目に見える形にする"]].map(([t,g])=>({id:uid(),title:t,goal:g,why:"「"+title+"」に近づくための段階です。",done:false}));
    S.ideal.milestones=[];
    S.ideal.revisions=[];S.ideal.reflections=[];S.ai=null;S.box=null;
    S.logs=[];S.sample=false;
  }
  S.cleared=false;view="home";clearDraft();OB=freshOB();save();render();
}
(NS()?hydrateNative().then(render,render):render());
cloudInit();
aiProbe();
if(usingProxy()){refreshQuota().then(()=>{if(view==="set")render()});loadPackPrices()}
updateAiLeft();
document.addEventListener("DOMContentLoaded",updateAiLeft);
</script>
